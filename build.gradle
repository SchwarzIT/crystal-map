// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.3.21'
    ext.kotlin_poet_version = '2.3.0'
    ext.junit_version = '6.0.1'
    ext.mockito_version = "5.21.0"
    ext.kotlinx_coroutines_core_version = "1.11.0"
    ext.commons_lang3_version = "3.20.0"
    ext.groupName = 'com.github.SchwarzIT'
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath("com.android.library:com.android.library.gradle.plugin:9.2.1")
        classpath("com.android.application:com.android.application.gradle.plugin:9.2.1")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:14.0.1"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.9"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

subprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
    }

    ktlint {

        filter {
            exclude { it.file.path.contains(layout.buildDirectory.dir("generated").get().asFile.path) }
        }
    }

}

def versionName() {

    if (!hasProperty("version")) {
        // don't care
        return "dummy"
    }

    return property("version")
}


allprojects {
    version = versionName()
    group = groupName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven {
            url "https://mobile.maven.couchbase.com/maven2/dev/"
        }
    }
}
