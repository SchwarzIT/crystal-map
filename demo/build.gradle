apply plugin: 'com.android.application'
apply plugin: "com.google.devtools.ksp"

//TODO enable to localy test plugin
//apply plugin: 'andcouchbase-entity-versioning-plugin'
//
//import com.schwarz.crystalapi.schema.DefaultSchemaValidator
//
//couchbaseEntityVersioning{
//    currentSchema "${buildDir.absolutePath}/entity_schema/demo_schema.json"
//    versionedSchemaPath = "${buildDir.absolutePath}/version_test"
//    validationClazz = DefaultSchemaValidator.class
//}

android {

    namespace "com.schwarz.crystaldemo"
    compileSdk = 36
    defaultConfig {
        applicationId "com.schwarz.crystaldemo"
        minSdk = 26
        targetSdk = 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }

    // workaround for "duplicate files during packaging of APK" issue:
    packaging {
        resources {
            excludes += ['META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

def buildDirPath = layout.buildDirectory.get().asFile.absolutePath

ksp {
    arg("crystal.entityframework.useSuspend", "false")
    arg("crystal.entityframework.documentation.generated", "${buildDirPath}/entity")
    arg("crystal.entityframework.documentation.fileName", "demo.html")
    arg("crystal.entityframework.schema.generated", "${buildDirPath}/entity_schema")
    arg("crystal.entityframework.schema.fileName", "demo_schema.json")
    // crystal.cache.dir disabled: the persistent generation cache makes the processor
    // skip createNewFile on full KSP reprocessing runs, so KSP deletes the generated
    // sources and compilation fails (cache outlives the KSP task outputs).
    // arg("crystal.cache.dir", "${buildDirPath}/generated/ksp/crystal-cache")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(path: ':crystal-map-api')
    implementation project(path: ':crystal-map-couchbase-connector')
    implementation project(path: ':dummy')
    ksp ksp(project(':crystal-map-ksp',))
    implementation 'com.couchbase.lite:couchbase-lite-android:2.1.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:$mockito_version"
    implementation 'ch.qos.logback:logback-core:1.5.21'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    testImplementation 'ch.qos.logback:logback-classic:1.5.21'
}
